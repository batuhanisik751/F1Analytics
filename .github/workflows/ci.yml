# CI for F1 Analytics (OPS_SPEC §1, §6.1). No secrets: the only token is the job's own
# GITHUB_TOKEN, used read-only to download the fixture Release asset. No make.
#
#   web         T0  npm ci, check:invariants, typecheck, lint, unit tests, build (artefact for a11y)
#   py-pure     T0  pytest -m "not db and not cache" — no services
#   py-db       T1  postgres:16 + fixture restore + migrate + roles; pytest -m "db and not cache"
#                   in ONE invocation (db tests mutate; never sharded); then a11y against `next start`
#   py-db-slow  T1  tests/test_mode2_model.py on its own service and its own restore
#   coverage        sums the junit XML and prints `ran N of T (P%) — not run: A fixture-cache,
#                   B direct-cache`; fails below the floor in tests/ci_census.json
#
# Every skip is printed (-rs); a lost database is pytest.exit(3) (F1_REQUIRE_DB=1); a11y cannot
# skip (A11Y_REQUIRE=1); every job has timeout-minutes: 20 so a cache-bound test that reaches
# FastF1's network path goes red, never slow-green.
#
# The paths filter (OPS_SPEC §10.5, IDEAS_2026-09 §0). Measured: a full green run is ~10 min wall
# and ~20-25 billed minutes, with py-db-slow the critical path; at ~7.5 pushes/hour the 2,000-minute
# budget lasts one working day. So the `classify` job diffs the push (or PR) against its base ONCE,
# up front, and the slow model tier (`py-db-slow`, 16 of the 16 minutes) runs only when that diff
# touches model, schema, script, test or query-layer paths (the list is in `classify`). Everything
# else is a "light" run: `web` + `py-pure` + `py-db` (the db tier and the a11y sweep still run,
# ~7 min wall / ~8 billed). A schedule (nightly on main) or workflow_dispatch is ALWAYS full,
# so main gets one full run a night whatever was pushed. The `coverage` job prints WHICH kind of
# run this was and, on a light run, links the last full run on main — a skipped tier is printed,
# never silent (§1.3 rule 3). It is `git diff --name-only`, not a third-party action: no extra
# permission, no extra pin, and the fallback (any doubt about the base → full) is one shell line
# you can read.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 09:30 UTC = 05:30 EDT: after the laptop's 03:20 local update_season.py has pushed (or not).
    # Runs on main only (GitHub runs schedules on the default branch) and is always a full run.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push mid-run CANCELS the run in progress for the same ref: that is what made 7 of the first 9
# runs read as failed (they were cancelled by the next push, not red). The event name is part of
# the group so the nightly schedule and a push at the same hour do not cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  F1_CI: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NODE_VERSION: "22.19.0"
  PYTHON_VERSION: "3.13.5"

jobs:
  classify:
    # Decides `mode` (full | light) for the whole run. Full when the event is a schedule or a
    # dispatch, when the base commit is unknown (new branch, force push, first push), when the diff
    # cannot be computed, or when any changed path matches the list below. Every other case is
    # light. The decision and the matching files are printed to this job's summary.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      changed_db_code: ${{ steps.decide.outputs.changed_db_code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Diff against the base and classify
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          # Paths that mean "full run". Anything else (docs, README, web copy and components,
          # captions, styles) is light. web/lib/queries and web/app/api stay here on purpose:
          # a query-file rename is the case the filter must not miss.
          FULL_PATHS: '^(f1lab/|db/|scripts/|tests/|web/lib/queries/|web/app/api/|web/drizzle/|web/db/|requirements[^/]*\.txt$|pyproject\.toml$|\.github/workflows/ci\.yml$|\.github/actions/)'
        run: |
          set -u
          decide() {
            { echo "mode=$1"; echo "changed_db_code=$2"; echo "reason=$3"; } >> "$GITHUB_OUTPUT"
            { echo "## paths filter"; echo ""; echo "**$1 run** — $3"; echo ""; [ -n "${4:-}" ] && printf '```\n%s\n```\n' "$4"; } >> "$GITHUB_STEP_SUMMARY"
            echo "paths filter: $1 run — $3"; exit 0
          }
          case "$EVENT" in
            schedule|workflow_dispatch) decide full true "$EVENT trigger is always a full run" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            decide full true "no base commit to diff against (new branch or first push)"
          fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null \
            || decide full true "base $BASE is not fetchable (force push or rewritten history)"
          files=$(git diff --name-only "$BASE" "$HEAD") \
            || decide full true "git diff $BASE..$HEAD failed"
          hits=$(printf '%s\n' "$files" | grep -E "$FULL_PATHS" || true)
          if [ -n "$hits" ]; then
            decide full true "changed paths match the full-run list" "$hits"
          fi
          decide light false "no model, schema, script or test change in $(printf '%s\n' "$files" | grep -c .) changed file(s)" "$files"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:invariants
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            web/.next
            !web/.next/cache
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  py-pure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Collected total (the denominator of the coverage line)
        run: |
          mkdir -p out
          python -m pytest tests --collect-only -q | tail -1 | tee out/collected.txt
      - run: python -m pytest tests -m "not db and not cache" -q -rs --junitxml=out/junit-pure.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-pure
          path: |
            out/junit-pure.xml
            out/collected.txt
          if-no-files-found: error

  py-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web]                       # only for the .next artefact; py-pure stays parallel
    # Runs on light AND full: 4.6 min, and it carries the a11y sweep, which is exactly what a
    # components-only (light) change can break. Only py-db-slow is gated.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: f1
          POSTGRES_DB: f1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f1 -d f1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://f1:f1@localhost:5432/f1
      F1_REQUIRE_DB: "1"               # an unreachable database is pytest.exit(3), never a skip
      A11Y_BASE_URL: http://localhost:3000
      A11Y_REQUIRE: "1"                # serverUp() throws instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-ci.txt
      - name: Restore the fixture, migrate to head, apply roles
        uses: ./.github/actions/restore-fixture
      - name: Migrations apply from an empty database
        working-directory: web
        env:
          DATABASE_URL: postgres://f1:f1@localhost:5432/f1_empty
        run: |
          psql postgres://f1:f1@localhost:5432/f1 -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE f1_empty"
          npm run db:migrate
          python ../scripts/ci_fixture.py assert-at-head
      - name: pytest — db tier, one invocation in file order
        run: >-
          python -m pytest tests -m "db and not cache" -q -rs --durations=15
          --ignore=tests/test_mode2_model.py --junitxml=out/junit-db.xml
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: web/.next
      - name: Start the production server
        working-directory: web
        run: |
          mkdir -p ../out
          nohup npm run start -- -p 3000 > ../out/next-start.log 2>&1 &
          echo $! > ../out/next-start.pid
          python ../scripts/ci_wait.py "$A11Y_BASE_URL/glossary" 90 || { cat ../out/next-start.log; exit 1; }
      - name: a11y against next start
        working-directory: web
        env:
          A11Y_TEST_FLAGS: --test-reporter=junit --test-reporter-destination=../out/junit-a11y.xml
        run: npm run test:a11y
      - name: Stop the server
        if: always()
        run: |
          test -f out/next-start.pid && kill "$(cat out/next-start.pid)" 2>/dev/null || true
          test -f out/next-start.log && tail -n 40 out/next-start.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-db
          path: out/junit-*.xml
          if-no-files-found: error

  py-db-slow:
    runs-on: ubuntu-latest
    # 20 was too tight: the job took 20:18 on one runner (cancelled) and 16:54 on another (green).
    # test_mode2_model bootstraps with 8 workers; on a 2-vCPU runner they oversubscribe the cores.
    timeout-minutes: 40
    needs: [classify]
    if: needs.classify.outputs.mode == 'full'   # light run: skipped, and coverage says so
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: f1
          POSTGRES_DB: f1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f1 -d f1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # One BLAS thread per bootstrap worker. Eight workers x several BLAS threads on two cores is
      # why 217 s locally became 17-20 min here. Results are unchanged; only the clock moves.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      DATABASE_URL: postgres://f1:f1@localhost:5432/f1
      F1_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-ci.txt
      - name: Restore the fixture, migrate to head, apply roles
        uses: ./.github/actions/restore-fixture
      - name: pytest — tests/test_mode2_model.py alone
        run: python -m pytest tests/test_mode2_model.py -q -rs --durations=10 --junitxml=out/junit-db-slow.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-db-slow
          path: out/junit-db-slow.xml
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [classify, py-pure, py-db, py-db-slow]
    # always(): a skipped or failed tier must still be COUNTED and PRINTED. On a full run the
    # script prints the `ran N of T` line and fails below the floor; on a light run it prints
    # `light run: the slow model tier skipped ...; last full run: <link>` and does not
    # apply the floor. An empty or missing mode (classify failed or was cancelled) is read as full,
    # which then fails on the missing db XML — never green over a tier that did not run.
    if: always()
    permissions:
      contents: read
      actions: read                    # `gh run list` / runs API for the last-full-run link
    env:
      MODE: ${{ needs.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: out
          merge-multiple: true
      - run: ls -l out
      - name: Last successful full run on main (light runs only; never fails)
        id: lastfull
        if: env.MODE == 'light'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          url=""; note=""
          # Newest first; a run is "full" when its py-db-slow job ran and succeeded (a light run's
          # py-db-slow concludes "skipped"). At most 40 runs / 40 API calls, then "none found yet".
          rows=$(gh run list --workflow ci.yml --branch main --status success --limit 40 \
                   --json databaseId,url,headSha,createdAt,event \
                   --jq '.[] | [.databaseId, .url, .headSha[0:7], .createdAt[0:10], .event] | @tsv' 2>/dev/null)
          while IFS=$'\t' read -r id u sha day ev; do
            [ -n "$id" ] || continue
            slow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
                     --jq '.jobs[] | select(.name == "py-db-slow") | .conclusion' 2>/dev/null)
            if [ "$slow" = "success" ]; then url="$u"; note="run $id ($ev on $sha, $day)"; break; fi
          done <<< "$rows"
          echo "last full run: ${url:-none found yet} ${note}"
          { echo "url=$url"; echo "note=$note"; } >> "$GITHUB_OUTPUT"
          exit 0
      - name: The number and the floor (full run) or the light line (light run)
        env:
          LAST_FULL_RUN: ${{ steps.lastfull.outputs.url }}
          LAST_FULL_RUN_NOTE: ${{ steps.lastfull.outputs.note }}
        run: >-
          python scripts/ci_coverage.py out/*.xml
          --census tests/ci_census.json
          --pin tests/ci_fixture.txt
          --collected out/collected.txt
          --expect junit-pure.xml,junit-db.xml,junit-db-slow.xml,junit-a11y.xml
          --mode "${MODE:-full}"
          --last-full-run "$LAST_FULL_RUN"
          --last-full-run-note "$LAST_FULL_RUN_NOTE"
