services:
  postgres:
    build: ./db   # postgres:16 + ca-certificates, see db/Dockerfile
    image: postgres:16
    container_name: f1-postgres
    environment:
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
      POSTGRES_DB: f1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
